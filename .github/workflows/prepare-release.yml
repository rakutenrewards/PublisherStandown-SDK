name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Normalize version
        id: ver
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          RAW_VERSION: ${{ inputs.version }}

      - name: Bump version in package.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --no-package-lock

      - name: Open release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BRANCH="release/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore: release v${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: release v${VERSION}" \
            --body "Automated version bump for v${VERSION}. Merging this PR does **not** publish anything — run the Publish workflow afterward to tag and release this commit." \
            --base main \
            --head "$BRANCH"
